# ============================================================================
# dsh-whale-widget —— DSH bundle patch
# ============================================================================
# This is the plugin's "mount declaration". When DSH starts, it applies each
# plugin patch according to the bundle layer stack.
# This file inserts the whale balance widget into the Web profile's
# configuration tree.
#
# Installation method (manual copying / manual profile patch editing is no longer required):
#   dsh plugin --profile web add dsh-whale-widget
# Or for local development:
#   dsh plugin --profile web add link:<absolute path to this directory>
# ============================================================================

- insert:
    - id: dsh-whale-widget
      name: dsh-whale-widget
